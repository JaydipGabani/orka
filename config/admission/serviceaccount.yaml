apiVersion: v1
kind: ServiceAccount
metadata:
  name: orka-admission
  namespace: orka-system
  labels:
    app.kubernetes.io/name: orka
    app.kubernetes.io/component: coexistence-admission
# The admission service validates AdmissionReview payloads only and makes no
# Kubernetes API calls, so no token is mounted and no RBAC is bound.
automountServiceAccountToken: false
