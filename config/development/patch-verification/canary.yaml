apiVersion: apps/v1
kind: Deployment
metadata:
  name: validation-network-canary
  namespace: orka-validation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: validation-network-canary
  template:
    metadata:
      labels:
        app: validation-network-canary
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: canary
          image: REPLACE_WITH_TOOL_DIGEST
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/python3", "-u", "-m", "http.server", "18081", "--bind", "0.0.0.0"]
          workingDir: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: 18081
---
apiVersion: v1
kind: Service
metadata:
  name: validation-network-canary
  namespace: orka-validation
spec:
  selector:
    app: validation-network-canary
  ports:
    - port: 18081
      targetPort: 18081
