# Temporary trusted-host qualification only: root-owned Unix socket, never TCP.
root = "/var/lib/orka-buildkit"
insecure-entitlements = []

[dns]
  nameservers = ["168.63.129.16"]

[grpc]
  address = ["unix:///run/orka-buildkit-qualification.sock"]
  uid = 0
  gid = 0

[worker.oci]
  enabled = true
  max-parallelism = 1
  noProcessSandbox = false
  networkMode = "cni"
  cniConfigPath = "/etc/orka-buildkit/cni.json"
  cniBinaryPath = "/opt/orka-buildkit/cni"
  cniPoolSize = 0
  defaultCgroupParent = "/workloads"
  gc = true
  reservedSpace = "4GB"
  maxUsedSpace = "48GB"
  minFreeSpace = "8GB"

[worker.containerd]
  enabled = false
