{{- include "orka.omsKd6AdapterValidate" . -}}
{{- if and .Values.omsKd6Adapter.enabled .Values.omsKd6Adapter.persistence.enabled (not .Values.omsKd6Adapter.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "orka.omsKd6AdapterPVCName" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "orka.labels" . | nindent 4 }}
    app.kubernetes.io/component: oms-kd6-adapter
spec:
  accessModes:
    - {{ .Values.omsKd6Adapter.persistence.accessMode }}
  {{- if .Values.omsKd6Adapter.persistence.storageClass }}
  storageClassName: {{ .Values.omsKd6Adapter.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.omsKd6Adapter.persistence.size }}
{{- end }}
