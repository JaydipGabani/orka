apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "orka.harnessWrapperLedgerName" . }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-harness-wrapper
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.workers.harnessWrapper.ledger.persistence.storageClass }}
  storageClassName: {{ .Values.workers.harnessWrapper.ledger.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.workers.harnessWrapper.ledger.persistence.size }}
