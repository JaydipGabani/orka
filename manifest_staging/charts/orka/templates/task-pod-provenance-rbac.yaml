{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "orka.fullname" . }}-task-job-provenance-controller-preflight
  labels:
    {{- include "orka.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-40"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: ["batch"]
    resources: ["jobs/task-provenance"]
    verbs: ["admit"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "orka.fullname" . }}-task-job-provenance-controller-preflight
  labels:
    {{- include "orka.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-40"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "orka.fullname" . }}-task-job-provenance-controller-preflight
subjects:
  - kind: ServiceAccount
    name: {{ include "orka.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "orka.fullname" . }}-task-pod-provenance-admitter-preflight
  labels:
    {{- include "orka.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-40"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["pods/task-provenance"]
    verbs: ["admit"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "orka.fullname" . }}-task-pod-provenance-admitter-preflight
  labels:
    {{- include "orka.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-40"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "orka.fullname" . }}-task-pod-provenance-admitter-preflight
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: system:kube-controller-manager
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: system:serviceaccount:kube-system:job-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "orka.fullname" . }}-task-pod-provenance-admitter
  labels:
    {{- include "orka.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
rules:
  - apiGroups: [""]
    resources: ["pods/task-provenance"]
    verbs: ["admit"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "orka.fullname" . }}-task-pod-provenance-admitter
  labels:
    {{- include "orka.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "orka.fullname" . }}-task-pod-provenance-admitter
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: system:kube-controller-manager
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: system:serviceaccount:kube-system:job-controller
{{- end }}
